[project]
name = "parking-footprint"
version = "0.1.0"
description = "Reproducible land-allocation audits around buildings"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "YY Ahn" }]
keywords = ["gis", "parking", "reproducibility", "land-use"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "httpx>=0.28",
  "pyproj>=3.7",
  "shapely>=2.1",
]

[project.urls]
Homepage = "https://github.com/yy/parking-footprint"
Issues = "https://github.com/yy/parking-footprint/issues"
Repository = "https://github.com/yy/parking-footprint"

[project.scripts]
parking-footprint = "parking_footprint.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parking_footprint"]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.16",
  "ty>=0.0.64",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["parking_footprint"]

[tool.coverage.report]
fail_under = 95
show_missing = true
